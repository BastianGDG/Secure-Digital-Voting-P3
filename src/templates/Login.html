<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Secure Voting Platform</title>
  <style>
    /* 1. Global Reset & Theme Variables (Matching Design System) */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --accent-green: #10b981;
      --shadow-card: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text-main);
    }

    /* 2. Main Login Card */
    .login-card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    /* Subtle top accent gradient bar */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #10b981);
    }

    /* 3. Card Header & Security Badge */
    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
    }

    .security-badge svg {
      width: 30px;
      height: 30px;
      stroke-width: 2;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-green);
      background: #ecfdf5;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* 4. Form Groups & Inputs */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.45rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .label-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.65rem;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      outline: none;
      transition: all 0.2s ease;
      font-variant-numeric: tabular-nums;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: #94a3b8;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* 5. Primary Submit Button */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.95rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 1.5rem;
    }

    .button:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .button svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .button:hover svg {
      transform: translateX(3px);
    }

    /* 6. Footer Assurance & Back Link */
    .security-note {
      margin-top: 1.75rem;
      font-size: 0.775rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      text-align: center;
    }

    .security-note svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .back-home {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      text-align: center;
      width: 100%;
    }

    .back-home:hover {
      color: var(--primary);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="card-header">
      <!-- Shield Header Icon -->
      <div class="security-badge" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>

      <div>
        <span class="status-pill">
          <span class="status-dot"></span>
          Secure Access
        </span>
      </div>

      <h1>Log In</h1>
      <p class="subtitle">Log in using your CPR number and password.</p>
    </div>

    <!-- Login Form -->
    <form action="/login" method="post">
      <!-- CPR Number Input -->
      <div class="form-group">
        <div class="label-wrapper">
          <label for="cpr">CPR Number</label>
          <span class="label-hint">DDMMYY-XXXX</span>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.364a4.125 4.125 0 00-6.338 0" />
          </svg>
          <input 
            type="text" 
            id="cpr" 
            name="CPR" 
            placeholder="DDMMYY-XXXX" 
            autocomplete="off" 
            required 
            autofocus
          >
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="label-wrapper">
          <label for="password">Password</label>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
          <input 
            type="password" 
            id="password" 
            name="Password" 
            placeholder="••••••••" 
            required
          >
        </div>
      </div>

      <!-- Submit Action -->
      <button type="submit" class="button">
        <span>Log in to vote</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </form>

    <a href="/" class="back-home">&larr; Return to platform overview</a>
  </main>

</body>
</html>
