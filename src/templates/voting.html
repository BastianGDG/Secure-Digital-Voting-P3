<!DOCTYPE html>
<html>

<body>
<form action="/submit_vote" method="post">

{% for party, members in parties.items() %}

    <h2>{{ party }} {{ abbreviations[loop.index0] }}</h2>

    <input type="radio"
           name="vote"
           value="party:{{ party }}">
    <label>{{ party }} {{ abbreviations[loop.index0] }}</label>

    {% for member in members %}
        <input type="radio"
               name="vote"
               value="candidate:{{ member }}">
        <label>{{ member }}</label>

    {% endfor %}

{% endfor %}

<button type="submit">
    Submit Vote
</button>

</form>
</body>

</html>
