<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticator Setup - Secure Voting Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1e293b, #0f172a 60%, #020617);
      color: #0f172a;
      padding: 24px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4), 0 0 1px 1px rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: #2563eb;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .badge svg {
      width: 14px;
      height: 14px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* QR Code Canvas container */
    .qr-wrapper {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 16px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      border-radius: 8px;
      background: #ffffff;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-align: center;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">
      <svg fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
      </svg>
      Two-Factor Authentication
    </div>

    <h1>Verify Identity</h1>
    <p class="subtitle">Scan the QR code below using the authenticator app to complete setup.</p>

    <!-- Canvas receives the variable safely via data-otp -->
    <div class="qr-wrapper">
      <canvas id="canvas" data-otp="{{ onetimepass }}"></canvas>
    </div>

    <!-- Same form action, method, input name, and button behavior as your original -->
    <form action="" method="post">
      <label class="input-label" for="otp-input">Authenticator Code</label>
      <input type="number" id="otp-input" name="OTP" placeholder="000000" required>
      <button type="submit" formaction="/register">Submit Verification</button>
    </form>
  </div>

  <script type="module">
    import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';

    const canvas = document.getElementById('canvas');
    let otp = canvas.dataset.otp;

    QRCode.toCanvas(canvas, otp, (err) => {
        if (err) console.error(err);
    });
  </script>
</body>
</html>
