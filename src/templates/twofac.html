<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFA Verification - Secure Voting Platform</title>
  <style>
    /* 1. Global Reset & Theme Variables */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg-gradient: radial-gradient(circle at top right, #1e293b, #0f172a 60%, #020617);
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --accent-green: #10b981;
      --shadow-card: 0 25px 50px -12px rgba(11, 15, 25, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      padding: 1.5rem;
      color: var(--text-main);
    }

    /* 2. Main MFA Card */
    .mfa-card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Subtle top accent gradient bar */
    .mfa-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #10b981);
    }

    /* 3. Header & Badges */
    .card-header {
      margin-bottom: 2rem;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
    }

    .security-badge svg {
      width: 30px;
      height: 30px;
      stroke-width: 2;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-green);
      background: #ecfdf5;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 4. Form & Code Input */
    form {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.45rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .label-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 0.95rem 1rem;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-align: center;
      color: var(--text-main);
      background-color: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 0.75rem;
      outline: none;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
      font-variant-numeric: tabular-nums;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]::placeholder,
    input[type="text"]::placeholder {
      letter-spacing: normal;
      font-size: 0.95rem;
      font-weight: 400;
      color: #94a3b8;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* 5. Submit Button */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.95rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }


    .status-message {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
  padding: 0.7rem 0.9rem;
  font-size: 0.85rem;
  font-weight: 500;
  text-align: left;
  color: #b91c1c;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 0.65rem;
}

  .status-message svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

    .button:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .button svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .button:hover svg {
      transform: translateX(3px);
    }

    /* 6. Navigation & Trust Badge */
    .back-home {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-home:hover {
      color: var(--primary);
    }

    .security-note {
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .security-note svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .mfa-card {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <main class="mfa-card">
    <div class="card-header">
      <!-- Shield Key Icon -->
      <div class="security-badge" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>

      <div>
        <span class="status-pill">
          <span class="status-dot"></span>
          Two-Factor Verification
        </span>
      </div>

      <h1>Security Check</h1>
      <p class="subtitle">Enter the 6-digit verification code generated by your authenticator app.</p>
      {% if error %}
      <div class="status-message" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}
    </div>

    <!-- MFA Form -->
    <form action="" method="post">
      <div class="form-group">
        <div class="label-wrapper">
          <label for="otp">Authenticator Code</label>
          <span class="label-hint">6 digits</span>
        </div>
        <input 
          type="number" 
          id="otp" 
          name="OTP" 
          placeholder="000 000" 
          autocomplete="one-time-code"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          required 
          autofocus
        >
      </div>

      <button type="submit" formaction="/two_fac" class="button">
        <span>Verify & Proceed</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </form>

  </main>

  <script>
    // Enforce 6-digit maximum length for number input in browsers
    const otpInput = document.getElementById('otp');
    if (otpInput) {
      otpInput.addEventListener('input', function () {
        if (this.value.length > 6) {
          this.value = this.value.slice(0, 6);
        }
      });
    }
  </script>
</body>
</html>
