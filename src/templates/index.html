<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Voting Platform</title>
  <style>
    /* 1. Global Reset & Theme Variables */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-green: #10b981;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text-main);
    }

    /* 2. Main Container Card */
    .voting-card {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle top accent bar */
    .voting-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #10b981);
    }

    /* 3. Security Shield Badge */
    .security-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
    }

    .security-badge svg {
      width: 32px;
      height: 32px;
      stroke-width: 2;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-green);
      background: #ecfdf5;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    /* 4. Headings & Subtitles */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.925rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* 5. Countdown Grid */
    .timer-section {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem 1rem;
      margin-bottom: 2rem;
    }

    .timer-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: block;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .time-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .time-num {
      display: block;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .time-unit {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* 6. Primary Action Button */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.95rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .button:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .button svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .button:hover svg {
      transform: translateX(3px);
    }

    /* 7. Footer Assurance */
    .security-note {
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .security-note svg {
      width: 14px;
      height: 14px;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .voting-card {
        padding: 2rem 1.25rem;
      }
      .time-num {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <main class="voting-card">
    <!-- Security Shield Icon -->
    <div class="security-badge" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
    </div>

    <div>
      <span class="status-pill">
        <span class="status-dot"></span>
        Ballot Session Open
      </span>
    </div>

    <h1>Secure Voting Platform</h1>
    <p class="subtitle">Cast your ballot securely and transparently. Your encrypted vote directly influences our community decisions.</p>

    <!-- Visual Countdown Timer -->
    <div class="timer-section">
      <span class="timer-label">Time left until voting closes</span>
      <div class="countdown-grid" id="countdown-boxes">
        <div class="time-box">
          <span class="time-num" id="days">--</span>
          <span class="time-unit">Days</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="hours">--</span>
          <span class="time-unit">Hours</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="minutes">--</span>
          <span class="time-unit">Mins</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="seconds">--</span>
          <span class="time-unit">Secs</span>
        </div>
      </div>
    </div>

    <!-- Call to action button -->
    <button onclick="location.href = '/login';" class="button">
      Start voting
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    </button>
  </main>

  <script>
    countdowndate = new Date("{{closetime}}").getTime();

    function updateCountdown() {
      var now = new Date().getTime();
      var timeleft = countdowndate - now;

      if (timeleft <= 0) {
        document.getElementById("countdown-boxes").innerHTML = "<p style='grid-column: span 4; font-weight: 600; color: #ef4444; padding: 0.5rem;'>Voting period has concluded.</p>";
        clearInterval(timerInterval);
        return;
      }

      var days = Math.floor(timeleft / (1000 * 60 * 60 * 24));
      var hours = Math.floor((timeleft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((timeleft % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((timeleft % (1000 * 60)) / 1000);

      // Pad single digits for a uniform tabular look
      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    // Run immediately to prevent layout flash, then every second
    updateCountdown();
    var timerInterval = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
